<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PitchProof — Continue</title>
    <meta
      name="description"
      content="Return to PitchProof to finish email verification or password reset."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f0c;
        --fg: #fafafa;
        --muted: #a3a3a3;
        --accent: #a3e635;
        --accent-fg: #0b0f0c;
        --card: #141a16;
        --border: #243028;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f5;
          --fg: #0a0a0a;
          --muted: #737373;
          --accent: #65a30d;
          --accent-fg: #ffffff;
          --card: #ffffff;
          --border: #e5e5e5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2e0a 0%, var(--bg) 55%);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      .actions { display: grid; gap: 10px; margin-top: 8px; }
      a.button, button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        min-height: 48px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .primary {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
      code { font-size: 0.85em; word-break: break-all; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Continue in PitchProof</h1>
      <p id="message">
        Opening PitchProof to finish your email confirmation. If nothing happens, tap the button below.
      </p>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="actions">
        <a class="button primary" id="openApp" href="pitchproof://auth/action">Open PitchProof</a>
        <button class="button secondary" id="copyLink" type="button">Copy app link</button>
      </div>
    </main>
    <script>
      (function () {
        var APP_SCHEME = 'pitchproof';
        var params = new URLSearchParams(window.location.search);
        var mode = params.get('mode');
        var oobCode = params.get('oobCode');
        var apiKey = params.get('apiKey');
        var lang = params.get('lang');
        var nested = params.get('link') || params.get('deep_link_id');

        function buildAppUrl(query) {
          return APP_SCHEME + '://auth/action?' + query.toString();
        }

        function applyNested(linkValue) {
          try {
            var nestedUrl = new URL(linkValue);
            nestedUrl.searchParams.forEach(function (value, key) {
              if (!params.get(key)) {
                params.set(key, value);
              }
            });
            mode = params.get('mode');
            oobCode = params.get('oobCode');
            apiKey = params.get('apiKey');
            lang = params.get('lang');
          } catch (error) {
            // Ignore invalid nested links.
          }
        }

        if (nested) {
          applyNested(nested);
        }

        var statusEl = document.getElementById('status');
        var messageEl = document.getElementById('message');
        var openAppEl = document.getElementById('openApp');
        var copyButton = document.getElementById('copyLink');

        if (!mode || !oobCode) {
          messageEl.textContent =
            'Open PitchProof to continue. If you already confirmed your email in the browser, return to the app and sign in.';
          openAppEl.href = APP_SCHEME + '://login';
          statusEl.textContent = 'No verification code was found in this link.';
          return;
        }

        var query = new URLSearchParams({ mode: mode, oobCode: oobCode });
        if (apiKey) query.set('apiKey', apiKey);
        if (lang) query.set('lang', lang);
        var appUrl = buildAppUrl(query);

        openAppEl.href = appUrl;
        statusEl.textContent = 'Preparing secure return to PitchProof…';

        var opened = false;
        function openApp() {
          if (opened) return;
          opened = true;
          window.location.href = appUrl;
          statusEl.textContent = 'If PitchProof did not open, tap “Open PitchProof”.';
        }

        // Universal Links / App Links open the app when associated; custom scheme is fallback.
        setTimeout(openApp, 120);

        copyButton.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(appUrl).then(
              function () {
                statusEl.textContent = 'App link copied.';
              },
              function () {
                statusEl.textContent = appUrl;
              },
            );
          } else {
            statusEl.textContent = appUrl;
          }
        });
      })();
    </script>
  </body>
</html>
